<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업스케일 시험</title>
<style>
body { margin:0; padding:16px; background:#141210; color:#f1ebe2; font:15px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
h1 { font-size:18px; margin:0 0 12px; } .card { background:#1e1b18; border:1px solid #35302a; border-radius:12px; padding:14px; margin-bottom:12px; }
.hint { color:#a39a8d; font-size:13px; margin:6px 0; } .warn { color:#f5b94a; }
select, button, label.file { font:inherit; border-radius:8px; padding:9px 14px; border:1px solid #35302a; background:#12100e; color:#f1ebe2; }
button.go { background:#f5b94a; color:#221a08; border:0; font-weight:600; } button:disabled { opacity:.5; }
label.file { display:inline-block; border-style:dashed; cursor:pointer; } label.file input { display:none; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
progress { width:100%; height:12px; accent-color:#f5b94a; } img { max-width:100%; border-radius:8px; display:block; margin-top:8px; }
pre { white-space:pre-wrap; font:13px/1.5 monospace; color:#a39a8d; margin:8px 0 0; }
</style>
</head>
<body>
<h1>업스케일 시험</h1>
<div class="card">
  <div class="row"><label class="file">이미지 고르기<input type="file" id="f" accept="image/*"></label>
    <select id="ratio"></select>
    <select id="mode"><option value="auto">방식: 자동</option><option value="webgpu">그래픽 가속만</option><option value="wasm">일반 처리만</option></select></div>
  <p class="hint" id="info">배경으로 쓸 이미지를 고르세요. 이미지는 이 기기 밖으로 나가지 않습니다.</p>
  <div class="row"><button class="go" id="run" disabled>업스케일</button><button id="reset" hidden>실패 기록 지우기</button></div>
  <progress id="prog" value="0" max="1" hidden></progress>
  <p class="hint" id="status"></p>
</div>
<div class="card" id="out" hidden>
  <div class="row"><a id="dl"><button class="go">결과 저장</button></a></div>
  <img id="img">
  <pre id="log"></pre>
</div>
<script type="module">
const RATIOS = [['3:2', 2160, 1440], ['16:9', 2560, 1440], ['2:1', 2880, 1440], ['1:1', 1440, 1440], ['2:3', 1440, 2160], ['9:16', 1440, 2560], ['1:2', 1440, 2880]];
const TEXTURE = 0.7, PAD = 16, KEY = 'upscaleFails', RUN = 'upscaleRunning';
const $ = s => document.querySelector(s), st = $('#status'), info = $('#info'), run = $('#run');
for (const [n] of RATIOS) $('#ratio').append(new Option(n, n)); $('#ratio').value = '16:9';
let bmp = null;

// 지난번에 처리 도중 탭이 꺼졌으면(표시가 남아 있으면) 실패로 센다. 두 번이면 더 시도하지 않는다
if (localStorage.getItem(RUN)) { localStorage.removeItem(RUN); localStorage.setItem(KEY, (+localStorage.getItem(KEY) || 0) + 1); }
const fails = () => +localStorage.getItem(KEY) || 0;
function gate() {
  $('#reset').hidden = !fails();
  if (fails() >= 2) { st.className = 'hint warn'; st.textContent = '메모리가 부족해 이 기기에서는 업스케일을 할 수 없습니다.'; run.disabled = true; return false; }
  if (fails() === 1) { st.className = 'hint warn'; st.textContent = '지난번에 처리 도중 멈췄습니다. 한 번 더 시도할 수 있습니다.'; }
  return true;
}
$('#reset').onclick = () => { localStorage.removeItem(KEY); st.textContent = ''; run.disabled = !bmp; gate(); };
gate();

const target = () => RATIOS.find(r => r[0] === $('#ratio').value);
function describe() {
  if (!bmp) return; const [, W, H] = target(), s = Math.max(W / bmp.width, H / bmp.height);
  info.textContent = `원본 ${bmp.width}x${bmp.height}. ${W}x${H} 화면을 채우려면 ${s.toFixed(2)}배 필요` + (s <= 1 ? ' — 이미 충분해서 업스케일이 필요 없습니다(시험은 가능).' : `. 결과는 ${Math.round(bmp.width * Math.min(s, 4))}x${Math.round(bmp.height * Math.min(s, 4))}.`);
}
$('#f').onchange = async e => { const f = e.target.files[0]; if (!f) return; bmp = await createImageBitmap(f); describe(); run.disabled = fails() >= 2; };
$('#ratio').onchange = describe;

let ort = null;
async function session(ep) {
  ort ??= await import('./lib/ort/ort.webgpu.min.mjs');
  ort.env.wasm.wasmPaths = new URL('./lib/ort/', location.href).href; ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
  return ort.InferenceSession.create('./lib/ort/illust.onnx', { executionProviders: [ep] });
}

// 조각(tile)마다 4배로 키운 뒤, 필요한 배율로 줄여 결과 캔버스에 바로 그린다(4배 전체를 메모리에 올리지 않는다)
async function upscale(ep, tile, onProg) {
  const w = bmp.width, h = bmp.height, [, W, H] = target(), s = Math.min(4, Math.max(1, Math.max(W / w, H / h)));
  const sc = new OffscreenCanvas(w, h), sg = sc.getContext('2d', { willReadFrequently: true }); sg.drawImage(bmp, 0, 0);
  const src = sg.getImageData(0, 0, w, h).data, N = tile + PAD * 2, plane = N * N, inp = new Float32Array(3 * plane);
  const out = document.createElement('canvas'); out.width = Math.round(w * s); out.height = Math.round(h * s);
  const og = out.getContext('2d'); og.imageSmoothingQuality = 'high';
  const tc = new OffscreenCanvas(N * 4, N * 4), tg = tc.getContext('2d'), tid = tg.createImageData(N * 4, N * 4);
  const sess = await session(ep), total = Math.ceil(w / tile) * Math.ceil(h / tile); let done = 0;
  for (let ty = 0; ty < h; ty += tile) for (let tx = 0; tx < w; tx += tile) {
    for (let y = 0; y < N; y++) { const sy = Math.min(h - 1, Math.max(0, ty - PAD + y)) * w;      // 가장자리는 끝 픽셀을 이어 붙여 조각 크기를 항상 같게
      for (let x = 0; x < N; x++) { const p = (sy + Math.min(w - 1, Math.max(0, tx - PAD + x))) * 4, q = y * N + x; inp[q] = src[p] / 255; inp[plane + q] = src[p + 1] / 255; inp[2 * plane + q] = src[p + 2] / 255; } }
    const t = new ort.Tensor('float32', inp, [1, 3, N, N]);
    // 그래픽 가속이 첫 조각에서 30초 넘게 답이 없으면 멈춘 것으로 보고 일반 처리로 넘어간다
    const r = await (done || ep !== 'webgpu' ? sess.run({ x: t }) : Promise.race([sess.run({ x: t }), new Promise((_, no) => setTimeout(() => no(new Error('그래픽 가속 응답 없음')), 30000))])), o = r.y.data, P4 = N * 4 * N * 4, d = tid.data;
    for (let i = 0; i < P4; i++) { d[i * 4] = o[i] * 255 + .5; d[i * 4 + 1] = o[P4 + i] * 255 + .5; d[i * 4 + 2] = o[2 * P4 + i] * 255 + .5; d[i * 4 + 3] = 255; }
    r.y.dispose?.(); tg.putImageData(tid, 0, 0);
    const x0 = Math.round(tx * s), y0 = Math.round(ty * s), x1 = Math.round(Math.min(w, tx + tile) * s), y1 = Math.round(Math.min(h, ty + tile) * s);
    og.save(); og.beginPath(); og.rect(x0, y0, x1 - x0, y1 - y0); og.clip(); og.drawImage(tc, (tx - PAD) * s, (ty - PAD) * s, N * s, N * s); og.restore();
    onProg(++done / total); await new Promise(r => setTimeout(r));
  }
  await sess.release?.();
  return out;
}

// 원본의 입자 질감을 면 부분에만 되살린다(선 주변은 선명하게 둔다). 띠 단위로 처리해 메모리를 아낀다
function keepTexture(out, k) {
  const W = out.width, H = out.height, g = out.getContext('2d', { willReadFrequently: true }), M = 8, STRIP = 256;
  const rc = new OffscreenCanvas(W, STRIP + M * 2), rg = rc.getContext('2d', { willReadFrequently: true }); rg.imageSmoothingQuality = 'high';
  for (let y0 = 0; y0 < H; y0 += STRIP) {
    const a = Math.max(0, y0 - M), b = Math.min(H, y0 + STRIP + M), hh = b - a, sr = g.getImageData(0, a, W, hh), d = sr.data;
    rg.clearRect(0, 0, W, hh); rg.drawImage(bmp, 0, -a, W, H); const ref = rg.getImageData(0, 0, W, hh).data;
    const gray = new Float32Array(W * hh), mask = new Float32Array(W * hh), tmp = new Float32Array(W * hh);
    for (let i = 0; i < W * hh; i++) gray[i] = .299 * d[i * 4] + .587 * d[i * 4 + 1] + .114 * d[i * 4 + 2];
    for (let y = 1; y < hh - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x;
      const gx = gray[i - W + 1] + 2 * gray[i + 1] + gray[i + W + 1] - gray[i - W - 1] - 2 * gray[i - 1] - gray[i + W - 1], gy = gray[i + W - 1] + 2 * gray[i + W] + gray[i + W + 1] - gray[i - W - 1] - 2 * gray[i - W] - gray[i - W + 1];
      mask[i] = Math.hypot(gx, gy); }
    for (let pass = 0; pass < 2; pass++) {      // 5칸 평균을 가로세로 두 번: 부드럽게 번지게
      for (let y = 0; y < hh; y++) for (let x = 0; x < W; x++) { let sum = 0, n = 0; for (let j = -2; j <= 2; j++) { const xx = x + j; if (xx >= 0 && xx < W) { sum += mask[y * W + xx]; n++; } } tmp[y * W + x] = sum / n; }
      for (let y = 0; y < hh; y++) for (let x = 0; x < W; x++) { let sum = 0, n = 0; for (let j = -2; j <= 2; j++) { const yy = y + j; if (yy >= 0 && yy < hh) { sum += tmp[yy * W + x]; n++; } } mask[y * W + x] = sum / n; }
    }
    for (let i = 0; i < W * hh; i++) { const m = k * (1 - Math.min(1, mask[i] / 120)); for (let c = 0; c < 3; c++) d[i * 4 + c] += m * (ref[i * 4 + c] - d[i * 4 + c]); }
    g.putImageData(sr, 0, a, 0, y0 - a, W, Math.min(STRIP, H - y0));
  }
}

run.onclick = async () => {
  if (!bmp || !gate()) return;
  run.disabled = true; $('#out').hidden = true; $('#prog').hidden = false; st.className = 'hint'; localStorage.setItem(RUN, '1');
  const mode = $('#mode').value, plans = [...(navigator.gpu && mode !== 'wasm' ? [['webgpu', 192]] : []), ...(mode !== 'webgpu' ? [['wasm', 192], ['wasm', 96]] : [])], log = []; let out = null, used = null; const t0 = performance.now();
  for (const [ep, tile] of plans) {
    try { st.textContent = `준비 중… (${ep === 'webgpu' ? '그래픽 가속' : '일반 처리'})`; $('#prog').value = 0;
      out = await upscale(ep, tile, p => { $('#prog').value = p; st.textContent = `업스케일 중… ${Math.round(p * 100)}% (${ep === 'webgpu' ? '그래픽 가속' : '일반 처리'})`; }); used = `${ep}, 조각 ${tile}`; break;
    } catch (err) { console.error(err); log.push(`${ep}/${tile} 실패: ${err.message || err}`); }
  }
  const t1 = performance.now(); localStorage.removeItem(RUN); $('#prog').hidden = true; run.disabled = false;
  if (!out) { localStorage.setItem(KEY, fails() + 1); $('#out').hidden = false; $('#img').removeAttribute('src'); $('#log').textContent = log.join('\n'); st.textContent = '실패했습니다.'; return gate(); }
  st.textContent = '질감 되살리는 중…'; await new Promise(r => setTimeout(r, 30)); keepTexture(out, TEXTURE); const t2 = performance.now();
  const blob = await new Promise(r => out.toBlob(r, 'image/png')), url = URL.createObjectURL(blob);
  localStorage.removeItem(KEY); $('#reset').hidden = true;
  $('#img').src = url; $('#dl').href = url; $('#dl').download = 'upscaled.png'; $('#out').hidden = false;
  st.textContent = `완료. ${out.width}x${out.height}, ${((t2 - t0) / 1000).toFixed(1)}초.`;
  $('#log').textContent = [`방식: ${used}`, `업스케일 ${((t1 - t0) / 1000).toFixed(1)}초, 질감 ${((t2 - t1) / 1000).toFixed(1)}초`, `원본 ${bmp.width}x${bmp.height} → ${out.width}x${out.height}, 파일 ${(blob.size / 1048576).toFixed(1)}MB`, `기기 메모리 표시: ${navigator.deviceMemory ?? '알 수 없음'}GB, 코어 ${navigator.hardwareConcurrency ?? '?'}개`, ...log].join('\n');
};
</script>
</body>
</html>
